[project]
name = "deepseek-worker"
version = "0.1.0"
description = "Shared DeepSeek coding-worker harness for Codex/Claude/Grok managers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "python-ulid>=2.0",
]

[project.scripts]
dsw = "deepseek_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
