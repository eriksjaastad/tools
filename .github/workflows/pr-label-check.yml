name: "PR: Type Label"

# Derives the PR's type label from its conventional-commit title and applies
# it. Only fails when the title carries no recognizable type.
#
# Why derive instead of enforce: the old version ran on `opened` and failed if
# no label was present yet -- which is strictly before an agent can add one as
# a second step. A red run was the designed outcome of the normal path, and the
# house rule "create the label before opening the PR" existed only to dodge it.
#
# `security`, `hotfix` and `enhancement` have no commit-prefix mapping and are
# deliberate human judgement calls, so once present they are left alone. The
# seven derived labels stay tied to the title: correcting a title from `feat:`
# to `fix:` swaps `feature` for `bug` rather than leaving both.
#
# Labels applied here use GITHUB_TOKEN, which by design does not re-trigger
# workflows, so this does not loop.
#
# Fork PRs get a read-only token regardless of the permissions block below --
# that is enforced by GitHub, not chosen here -- so an outside contributor's PR
# cannot be self-labelled and needs a maintainer. These are single-owner repos
# today; revisit if any of them starts taking outside contributions.

on:
  pull_request:
    types: [opened, edited, reopened, labeled, unlabeled, synchronize]

permissions:
  pull-requests: write

jobs:
  # The job id MUST stay `check-label`. It is the status-check context name, and
  # six repos list `check-label` as a required check in branch protection:
  # tools, project-tracker, holoscape, flo-fi, muffinpanrecipes,
  # analyze-youtube-videos. Renaming it leaves those required checks permanently
  # pending and makes every PR in those repos unmergeable.
  # (The other twelve are private on a free plan, where branch protection is a
  # paid feature and the API returns 403 -- they have none to break.)
  check-label:
    runs-on: ubuntu-latest
    steps:
      - name: Derive type label from PR title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TYPES="feature enhancement bug chore refactor docs test hotfix security perf"
          # These three have no commit-prefix mapping. They are deliberate human
          # judgement calls, so once set they are never touched.
          MANUAL_ONLY="enhancement hotfix security"
          # These are derived from the title, so the title stays their truth and
          # a title correction re-derives them.
          AUTO_MAPPED="feature bug chore refactor docs test perf"

          # A `gh pr view` failure aborts here under `set -e` rather than being
          # mistaken for "this PR has no labels". Empty output means no labels.
          LABELS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')

          for type in $MANUAL_ONLY; do
            if echo "$LABELS" | grep -qx "$type"; then
              echo "Manual override label present: $type -- leaving it alone."
              exit 0
            fi
          done

          # Parse the conventional-commit type: "feat:", "fix(scope):", "docs!:"
          # PR_TITLE is read as data via an env var, never interpolated into
          # this script, so a title cannot inject shell.
          COMMIT_TYPE=$(printf '%s' "$PR_TITLE" \
            | sed -n -E 's/^[[:space:]]*([a-zA-Z]+)(\([^)]*\))?!?:.*/\1/p' \
            | tr '[:upper:]' '[:lower:]')

          case "$COMMIT_TYPE" in
            feat)                  LABEL=feature     ;;
            fix)                   LABEL=bug         ;;
            docs)                  LABEL=docs        ;;
            chore)                 LABEL=chore       ;;
            refactor)              LABEL=refactor    ;;
            test)                  LABEL=test        ;;
            perf)                  LABEL=perf        ;;
            ci|build|style)        LABEL=chore       ;;
            # enhancement / hotfix / security have no commit-prefix mapping by
            # design -- they are deliberate manual overrides. The
            # already-labelled branch above lets them through untouched.
            *)
              echo "::error::PR #${PR_NUMBER} title has no recognizable type: \"${PR_TITLE}\""
              echo "Title must start with a conventional-commit type, e.g. 'feat: add X (#1234)'."
              echo "Recognized: feat fix docs chore refactor test perf ci build style"
              echo "Or set a type label by hand: $TYPES"
              exit 1
              ;;
          esac

          echo "Title type '${COMMIT_TYPE}' -> label '${LABEL}'"

          # Collect every derived label that is NOT the one the title implies.
          # This runs whether or not the correct label is already present: a PR
          # can carry the right label AND a leftover wrong one, and that pair
          # would otherwise never be cleaned up. Built as an array so a label
          # containing a space, a dash or a glob character can never word-split
          # into an argument to gh. Nothing but the seven fixed names can reach
          # it today; the array keeps that true if the list is ever extended.
          STALE=()
          for type in $AUTO_MAPPED; do
            if [ "$type" != "$LABEL" ] && echo "$LABELS" | grep -qx "$type"; then
              echo "Stale derived label to remove: ${type}"
              STALE+=(--remove-label "$type")
            fi
          done

          if echo "$LABELS" | grep -qx "$LABEL"; then
            echo "Type label already correct: ${LABEL}"
          else
            # Added in its own call, BEFORE any removal, so a failure here
            # leaves the PR with whatever label it already had rather than
            # stripping it and then failing to add the replacement.
            if ! gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$LABEL"; then
              echo "::error::Could not apply label '${LABEL}' to PR #${PR_NUMBER}."
              echo "Most likely the label does not exist in ${REPO}, or the token lacks write access."
              echo "Fork PRs get a read-only token regardless of this workflow's permissions block,"
              echo "so an outside contributor's PR must be labelled by a maintainer."
              echo "Create a missing label with: gha label create ${LABEL} --repo ${REPO}"
              exit 1
            fi
            echo "Applied type label: ${LABEL}"
          fi

          if [ ${#STALE[@]} -gt 0 ]; then
            if ! gh pr edit "$PR_NUMBER" --repo "$REPO" "${STALE[@]}"; then
              echo "::error::Applied '${LABEL}' but could not remove the stale label(s) on PR #${PR_NUMBER}."
              echo "The PR now carries more than one type label. Remove the extra by hand."
              exit 1
            fi
            echo "Removed stale derived label(s)."
          fi
