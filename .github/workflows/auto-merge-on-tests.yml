name: Auto-merge on green (reusable)

# Reusable workflow: optional tests + merge-on-green.
# No AI review on GitHub — code review is done locally.
#
# Each caller passes its own test_command (shell). If omitted, the test
# job is a no-op and auto-merge fires immediately.
#
# Example caller (~/.github/workflows/pr.yml in any repo):
#
#     name: PR
#     on:
#       pull_request:
#         types: [opened, reopened, labeled, unlabeled, synchronize]
#     permissions:
#       contents: write
#       pull-requests: write
#     jobs:
#       pr:
#         uses: eriksjaastad/tools/.github/workflows/auto-merge-on-tests.yml@main
#         with:
#           test_command: |
#             uv sync --extra test
#             uv run -m pytest -m "not slow" --tb=short -q

on:
  workflow_call:
    inputs:
      test_command:
        description: "Shell command(s) that run the repo's fast tests. Leave empty to skip the test job."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

# Type labelling is NOT duplicated here. It lives in the standalone
# pr-label-check.yml, which every repo carries and which derives the label from
# the PR title. This workflow used to carry a second, divergent copy of that
# check (#7344).

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Skip test step (no test_command provided)
        if: inputs.test_command == ''
        run: echo "No test_command provided. Skipping tests — auto-merge will fire."
      - name: Run tests
        if: inputs.test_command != ''
        shell: bash
        run: ${{ inputs.test_command }}

  auto-merge:
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Merge on green
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Tests green. Merging PR #${PR_NUMBER}..."
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --merge \
            --delete-branch
          echo "PR #${PR_NUMBER} merged and branch deleted."
