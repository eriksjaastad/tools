name: Tests

# Runs this repo's own test suites on every PR and reports pass/fail.
#
# Deliberately NOT the reusable auto-merge-on-tests.yml workflow: that one
# bundles merge-on-green, and landing in this repo stays manual (Erik's call,
# 2026-09-01). This job only reports.
#
# Includes governance, startup-cleanup and workflow-sync regressions.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Block silent-failure patterns in tracked Python
        run: uv run --python 3.12 governance/silent-failure-gate.py

      - name: Check changed Python deletion sites
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --python 3.12 governance/validators/source-deletion-check.py --base "$PR_BASE_SHA"

      - name: Run test suites
        run: |
          uv run --python 3.12 --with 'pytest>=8,<10' \
            --with 'PyYAML>=6,<7' pytest \
            governance/validators/tests/ \
            tests/startup-cleanup/ \
            tests/workflows/ \
            -q

      - name: Run batch-crop tests
        run: uv run --frozen --python 3.12 --directory batch-crop pytest -q
