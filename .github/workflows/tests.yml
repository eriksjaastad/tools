name: Tests

# Runs this repo's own test suites on every PR and reports pass/fail.
#
# Deliberately NOT the reusable auto-merge-on-tests.yml workflow: that one
# bundles merge-on-green, and landing in this repo stays manual (Erik's call,
# 2026-09-01). This job only reports.
#
# Includes governance, integrity-warden, authentication, identity-hook and
# route pricing regressions. Authentication executables are stubbed; these
# suites do not mint live tokens or call providers.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Block silent-failure patterns in tracked Python
        run: uv run --python 3.12 governance/silent-failure-gate.py

      - name: Run test suites
        env:
          PYTHONPATH: model-bench:integrity-warden
        run: |
          uv run --python 3.12 --with 'pytest>=8,<10' --with 'PyJWT>=2,<3' \
            --with 'httpx>=0.27,<1' --with 'typer>=0.12,<1' --with 'rich>=13,<15' pytest \
            governance/validators/tests/ \
            integrity-warden/tests/ \
            tests/auth/ \
            tests/hooks/ \
            tests/remediation/ \
            route/test_pricing.py \
            route/test_readers.py \
            model-bench/tests/test_registry.py \
            model-bench/tests/test_seat_runner.py \
            model-bench/tests/test_seat_scorer.py \
            -q
