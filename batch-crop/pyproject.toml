[project]
name = "batch-crop"
version = "0.1.0"
description = "Crop many images at once: aspect ratios, fixed sizes, boxes, focal points."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.1"]

[project.scripts]
batch-crop = "batch_crop.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batch_crop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
